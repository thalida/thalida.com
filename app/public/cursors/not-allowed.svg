<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round">
    <circle cx="12" cy="12" r="9" fill="#bf00ff" fill-opacity="0.35"/>
    <line x1="7" y1="7" x2="17" y2="17"/>
  </g>
</svg>
