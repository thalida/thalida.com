<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Neon glow filter: tight inner + wide outer bloom -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Wide outer bloom -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="35" result="blur-wide"/>
      <feColorMatrix in="blur-wide" type="matrix"
        values="0 0 0 0 0.106
                0 0 0 0 0.894
                0 0 0 0 0.549
                0 0 0 0.6 0" result="glow-wide"/>
      <!-- Tight inner glow -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur-tight"/>
      <feColorMatrix in="blur-tight" type="matrix"
        values="0 0 0 0 0.106
                0 0 0 0 0.894
                0 0 0 0 0.549
                0 0 0 0.9 0" result="glow-tight"/>
      <!-- Compose: wide glow + tight glow + sharp original -->
      <feMerge>
        <feMergeNode in="glow-wide"/>
        <feMergeNode in="glow-tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#030a12"/>

  <!-- Artistic <3 mark with neon glow -->
  <g filter="url(#neon-glow)">
    <!-- < chevron: expressive, sweeping strokes -->
    <polyline
      points="565,175 435,315 565,455"
      fill="none" stroke="#1be48c" stroke-width="26"
      stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 3 numeral: flowing curves -->
    <path
      d="M625 175 L725 175 Q765 175 765 215 L765 275 Q765 315 725 315 L675 315
         M725 315 Q765 315 765 355 L765 415 Q765 455 725 455 L625 455"
      fill="none" stroke="#1be48c" stroke-width="26"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
