name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
    types: [closed]

# Cloudflare Pages auto-deploy must be paused in the dashboard.
# This workflow handles media sync → frontend build → deploy in order.

jobs:
  # ── Sync media to R2 ─────────────────────────────────────────────
  sync-media:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    name: Sync media to R2
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Determine branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync media to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/sync-media.sh --prefix "${{ steps.branch.outputs.name }}"

  # ── Deploy frontend to Cloudflare Pages (after media sync) ───────
  deploy-pages:
    needs: [sync-media]
    name: Deploy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        env:
          PUBLIC_R2_BASE_URL: ${{ vars.R2_PUBLIC_URL }}
          CF_PAGES_BRANCH: ${{ needs.sync-media.outputs.branch }}
        run: npm run build:pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ needs.sync-media.outputs.branch }}

  # ── Deploy API Worker (preview) on PRs with api/ changes ─────────
  deploy-api-preview:
    if: github.event_name == 'pull_request'
    name: Deploy API (preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for api changes
        id: changes
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD | grep -q '^api/'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.api == 'true'
        working-directory: api
        run: npm ci

      - name: Deploy Worker (preview)
        if: steps.changes.outputs.api == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy --env preview

  # ── Deploy API Worker (production) on push to main ───────────────
  deploy-api-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy API (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for api changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^api/'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.api == 'true'
        working-directory: api
        run: npm ci

      - name: Deploy Worker (production)
        if: steps.changes.outputs.api == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy --env=""

  # ── Cleanup R2 branch prefix when PR is merged ───────────────────
  cleanup-media:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    name: Cleanup R2 branch media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Delete branch media from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/cleanup-r2-prefix.sh --prefix "${{ github.event.pull_request.head.ref }}"
