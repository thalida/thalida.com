name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
    types: [closed]

# Cloudflare Pages auto-deploy must be paused in the dashboard.
# This workflow handles media sync → frontend build → deploy in order.

jobs:
  # ── Sync media to R2 ─────────────────────────────────────────────
  sync-media:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    name: Sync media to R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - name: Determine branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync media to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: just media::sync --prefix ${{ steps.branch.outputs.name }}

  # ── Deploy frontend to Cloudflare Pages ──────────────────────────
  deploy-pages:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    name: Deploy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: extractions/setup-just@v2

      - name: Determine branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build frontend
        env:
          PUBLIC_R2_BASE_URL: ${{ vars.PUBLIC_R2_BASE_URL }}
          PUBLIC_CHAT_WS_URL: ${{ github.event_name == 'push' && vars.PUBLIC_CHAT_WS_URL || vars.PUBLIC_CHAT_WS_URL_PREVIEW }}
          PUBLIC_OPENWEATHER_KEY: ${{ secrets.PUBLIC_OPENWEATHER_KEY }}
          PUBLIC_IPREGISTRY_KEY: ${{ secrets.PUBLIC_IPREGISTRY_KEY }}
          CF_PAGES_BRANCH: ${{ steps.branch.outputs.name }}
        run: just app::build-pages

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: just app::deploy --branch "${{ steps.branch.outputs.name }}" --project "${{ vars.CLOUDFLARE_PAGES_PROJECT }}"

  # ── Deploy API Worker (preview) on PRs with api/ changes ─────────
  deploy-api-preview:
    if: github.event_name == 'pull_request'
    name: Deploy API (preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: extractions/setup-just@v2

      - name: Check for api changes
        id: changes
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD | grep -q '^api/'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.api == 'true'
        working-directory: api
        run: npm ci

      - name: Deploy Worker (preview)
        if: steps.changes.outputs.api == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: just api::deploy --env preview

  # ── Deploy API Worker (production) on push to main ───────────────
  deploy-api-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy API (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: extractions/setup-just@v2

      - name: Check for api changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^api/'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.api == 'true'
        working-directory: api
        run: npm ci

      - name: Deploy Worker (production)
        if: steps.changes.outputs.api == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: just api::deploy --env prod

  # ── Cleanup R2 branch prefix when PR is merged ───────────────────
  cleanup-media:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    name: Cleanup R2 branch media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - name: Delete branch media from R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: just media::cleanup --branch "${{ github.event.pull_request.head.ref }}"
